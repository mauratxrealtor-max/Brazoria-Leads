name: Brazoria Motivated Seller Scraper

on:
  schedule:
    # Run daily at 7:00 AM UTC (2 AM CDT / 1 AM CST)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback days (default 90)"
        required: false
        default: "90"

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────
  scrape:
    name: Scrape & Commit Records
    runs-on: ubuntu-22.04
    outputs:
      records_changed: ${{ steps.check_diff.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '90' }}
        run: |
          python scraper/fetch.py

      - name: Check for record changes
        id: check_diff
        run: |
          if git diff --quiet dashboard/records.json data/records.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in records."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Records updated."
          fi

      - name: Commit and push updated records
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json data/leads.csv
          git commit -m "chore: update motivated seller leads $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload records artifact
        uses: actions/upload-artifact@v4
        with:
          name: brazoria-leads
          path: |
            data/records.json
            data/leads.csv
          retention-days: 30

  # ──────────────────────────────────────────────────
  deploy-pages:
    name: Deploy Dashboard to GitHub Pages
    runs-on: ubuntu-22.04
    needs: scrape
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # pull the latest commit (with updated records.json)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
